apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Homologação: amostragem total de traces, nome do ambiente nos logs e simulação de pagamento.
resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oficina-billing-config
        namespace: oficina
      data:
        APP_ENV: "hml"
        OTEL_TRACES_SAMPLER_ARG: "1.0"
        # Homologação: a rota /admin/payments/{id}/simulate faz o papel do banco (spec 05 §4, V4).
        PAYMENT_SIMULATION_ENABLED: "true"
