# ===================================================
# Billing Service — orçamentos e pagamentos (Fase 4, specs/fase4/05 no oficina-app)
# ===================================================
quarkus.application.name=oficina-billing-service
quarkus.http.port=8080
# O webhook limita o próprio corpo a 16 KB; o resto da API recebe JSON pequeno.
quarkus.http.limits.max-body-size=64K

# JWT: o mesmo emissor e a mesma chave pública do OS e do Lambda (ADR 0006).
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:keys/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:oficina-api}

# Chave que o API Gateway injeta em X-Gateway-Key. Vazia = filtro desligado (dev/test/docker).
app.gateway.key=${APP_GATEWAY_KEY:}

# PostgreSQL próprio do serviço (spec 02 §3). TLS obrigatório em produção, como no OS.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
# Sem URL no perfil de teste: os Dev Services sobem um PostgreSQL 16 descartável.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing_db}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing_db}?sslmode=require
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.acquisition-timeout=5s
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# AWS (SQS). Credenciais pela cadeia padrão do SDK: IMDS no k3s (ADR 0022), variáveis em dev.
app.aws.region=${AWS_REGION:us-east-1}
app.aws.endpoint-override=${AWS_ENDPOINT_OVERRIDE:}

# Mensageria: desligada sem as filas configuradas (dev sem AWS).
app.messaging.enabled=${APP_MESSAGING_ENABLED:false}
app.messaging.queues.commands=${SQS_BILLING_COMMANDS_URL:}
app.messaging.queues.os-replies=${SQS_OS_REPLIES_URL:}

# Pagamento. "simulated" (dev/hml/testes) ou "stripe" (Pix em modo de teste, ADR 0023).
app.payment.provider=${PAYMENT_PROVIDER:simulated}
app.payment.pix-ttl=${PAYMENT_PIX_TTL:PT30M}
app.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:false}
app.payment.stripe.api-key=${STRIPE_API_KEY:}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payment.stripe.api-version=${STRIPE_API_VERSION:2026-11-18.endive}

# E-mail do orçamento (mesmo SMTP do OS). Sem SMTP em dev, o mailer só registra no log.
app.budget.public-approval-url=${BUDGET_PUBLIC_APPROVAL_URL:http://localhost:8080/public/budgets}
quarkus.mailer.from=${MAILER_FROM:nao-responda@oficina.local}
quarkus.mailer.host=${MAILER_HOST:localhost}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.start-tls=${MAILER_START_TLS:DISABLED}
quarkus.mailer.mock=${MAILER_MOCK:true}
%prod.quarkus.mailer.mock=${MAILER_MOCK:false}

# OpenAPI
quarkus.smallrye-openapi.info-title=Oficina — Billing Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

# Jackson
quarkus.jackson.serialization-inclusion=non_null
quarkus.jackson.write-dates-as-timestamps=false

# Observabilidade: métricas em /q/metrics, health em /q/health, traces OTLP (desligados sem licença).
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:https://otlp.nr-data.net:4317}
quarkus.otel.exporter.otlp.traces.headers=api-key=${NEW_RELIC_LICENSE_KEY:unset}
quarkus.otel.resource.attributes=service.namespace=oficina,deployment.environment=${APP_ENV:local}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:1.0}

# Logs
quarkus.log.level=INFO
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
%prod.quarkus.log.console.json.additional-field."env".value=${APP_ENV:prod}

# ===================================================
# Teste: PostgreSQL pelos Dev Services, SQS pelo LocalStackResource; agendamentos acionados pelos testes.
# ===================================================
%test.mp.jwt.verify.publickey.location=test-keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=test-keys/privateKey.pem
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.scheduler.enabled=false
%test.quarkus.mailer.mock=true
%test.app.payment.simulation-enabled=true
%test.app.payment.stripe.webhook-secret=segredo-de-teste-do-webhook
