# Menor privilégio de rede: entra só o Traefik (e o kubelet, pelas probes); sai só DNS, o PostgreSQL próprio (RDS),
# HTTPS (SQS, Mercado Pago e OTLP do New Relic), SMTP com TLS e o IMDS da EC2, de onde vêm as credenciais do LabRole
# (ADR 0022).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oficina-billing
  namespace: oficina
spec:
  podSelector:
    matchLabels:
      app: oficina-billing
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 587
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
